[package]
name = "tauri-plugin-gallery"
version = "0.2.0"
description = "ai-image 相册保存插件：Android 通过 MediaStore 写入系统相册"
edition = "2021"
authors = ["ai-image"]
license = "MIT"
links = "tauri-plugin-gallery"
build = "build.rs"
exclude = [".github"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
